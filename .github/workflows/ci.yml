name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: isolated-test-only
        ports:
          - 55439:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Install all workspaces
        run: npm run install:all

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Assistant API and isolated database tests
        run: npm run test:assistant
        env:
          ROLODEX_TEST_DATABASE_URL: postgres://postgres:isolated-test-only@127.0.0.1:55439/postgres

      - name: Accessibility tests
        run: npm run test:a11y

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
